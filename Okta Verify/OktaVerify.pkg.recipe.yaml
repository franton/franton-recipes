Description: Downloads the latest version of Okta Verify.
Identifier: com.github.franton.pkg.OktaVerify
ParentRecipe: com.github.franton.icon.OktaVerify
MinimumVersion: '2.9'

Input:
  NAME: OktaVerify
  TENANT: ''
  CHANNEL: 'GA'
  DOWNLOAD_MISSING_FILE: null
  SIZE: ''
  EXCLUDE: ''
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'TENANT == nil'

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: EndOfCheckPhase

  - Processor: PkgCopier
    Arguments:
      source_pkg: "%pathname%"
      pkg_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%-%version%.pkg"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/downloads'
