Description: Creates an icon from DisplayLink Manager.
Identifier: com.github.franton.icon.DisplayLinkManager
ParentRecipe: com.github.franton.download.DisplayLinkManager
MinimumVersion: '2.9'

Input:
  NAME: DisplayLinkManager
  BASE_URL: https://www.synaptics.com
  SEARCH_URL: products/displaylink-graphics/downloads/macos
  EXCLUDE: ''
  SIZE: ''
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      flat_pkg_path: "%RECIPE_CACHE_DIR%/Downloads/%NAME%.pkg"
      destination_path: "%RECIPE_CACHE_DIR%/outerunpack"

  - Processor: PkgPayloadUnpacker
    Arguments:
      pkg_payload_path: "%RECIPE_CACHE_DIR%/outerunpack/DisplayLinkManagerApp.pkg/Payload"
      destination_path: "%RECIPE_CACHE_DIR%/unpack"

  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/unpack/DisplayLink Manager.app/Contents/Info.plist"

  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/%version%"
      pkgdirs: {}

  - Processor: com.github.franton.SharedProcessors/IconGenerator
    Arguments:
      file_path: "%RECIPE_CACHE_DIR%/unpack/DisplayLink Manager.app"
      exclude: '%EXCLUDE%'
      name_prefix: '%NAME%'
      output_path: "%RECIPE_CACHE_DIR%/%version%"
      size: "%SIZE%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/unpack'
        - '%RECIPE_CACHE_DIR%/outerunpack'
