Description: Versions the pkg from DisplayLink Manager.
Identifier: com.github.franton.pkg.DisplayLinkManager
ParentRecipe: com.github.franton.icon.DisplayLinkManager
MinimumVersion: '2.9'

Input:
  NAME: DisplayLinkManager
  BASE_URL: https://www.synaptics.com
  SEARCH_URL: products/displaylink-graphics/downloads/macos
  EXCLUDE: ''
  SIZE: ''
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: PkgCopier
    Arguments:
      source_pkg: "%RECIPE_CACHE_DIR%/downloads/%NAME%.pkg"
      pkg_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%-%version%.pkg"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/downloads'
