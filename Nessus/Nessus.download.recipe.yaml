Description: Downloads the latest version of Nessus agent.
Identifier: com.github.franton.download.Nessus
MinimumVersion: '2.9'

Input:
  NAME: Nessus
  URL: 'https://www.tenable.com/downloads/nessus-agents'
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'URL == nil'

  - Processor: URLTextSearcher
    Arguments:
      url: '%URL%'
      result_output_var_name: id
      re_pattern: '"id":([\d]*)(?=,"file":"NessusAgent-[\d\.]*\.dmg)'

  - Processor: URLTextSearcher
    Arguments:
      url: '%URL%'
      result_output_var_name: version
      re_pattern: 'NessusAgent-([\d\.]*)\.dmg'

  - Processor: EndOfCheckPhase

  - Processor: URLDownloader
    Arguments:
      CHECK_FILESIZE_ONLY: true
      url: 'https://www.tenable.com/downloads/api/v1/public/pages/nessus-agents/downloads/%id%/download?i_agree_to_tenable_license_agreement=true'
      filename: '%NAME%.dmg'

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      strict_verification: true
      input_path: '%pathname%/Install Nessus Agent.pkg'
      expected_authority_names:
        - "Developer ID Installer: Tenable, Inc. (4B8J598M7U)"
        - "Developer ID Certification Authority"
        - "Apple Root CA"
