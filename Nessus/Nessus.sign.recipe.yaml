Description: Packages the latest specified version of Nessus agent.
Identifier: com.github.franton.sign.Nessus
ParentRecipe: com.github.franton.pkg.Nessus
MinimumVersion: '2.9'

Input:
  NAME: Nessus
  URL: 'https://www.tenable.com/downloads/nessus-agents'
  EXCLUDE: 'ua'
  SIZE: '512'
  SIGNINGCERTIFICATE: ''
  CORP_ID: ''
  NESSUS_KEY: ''
  NESSUS_HOST: ''
  NESSUS_PORT: ''
  NESSUS_GROUPS: ''
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
   - Processor: StopProcessingIf
     Arguments:
      predicate: 'URL == nil'

   - Processor: StopProcessingIf
     Arguments:
      predicate: 'CORP_ID == nil'

   - Processor: StopProcessingIf
     Arguments:
      predicate: 'NESSUS_KEY == nil'

   - Processor: StopProcessingIf
     Arguments:
      predicate: 'NESSUS_HOST == nil'

   - Processor: StopProcessingIf
     Arguments:
      predicate: 'NESSUS_PORT == nil'

   - Processor: com.github.franton.SharedProcessors/PkgSigner
     Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%-%version%.pkg"
      signing_cert: "%SIGNINGCERTIFICATE%"

   - Processor: PathDeleter
     Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/%version%/%NAME%-%version%-unsigned.pkg'
