Description: Uploads the Adobe Creative Cloud Desktop pkg to Jamf.
Identifier: com.github.franton.policy.jamf.AdobeCCDesktop
ParentRecipe: com.github.franton.upload.jamf.AdobeCCDesktop
MinimumVersion: "2.9"

Input:
  NAME: AdobeCCDesktop
  SEARCH_URL: 'https://helpx.adobe.com/download-install/apps/download-install-apps/creative-cloud-apps/download-creative-cloud-desktop-app-using-direct-links.html'
  SEARCH_PATTERN: 'http.*?://ccmdls?.adobe.com/AdobeProducts/StandaloneBuilds/ACCC/ESD/.*?/.*?/macarm64/ACCC.*?.dmg'
  SIZE: '512'
  EXCLUDE: 'ua'
  CORP_ID: ''
  SIGNINGCERTIFICATE: ''
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

  # Processor variables
  REMOVE_OLD_PACKAGES: 'True'
  PKG_TO_KEEP: '2'
  PKG_NAME_MATCH: '%NAME%-'
  
  SLEEP: '1'
  MAX_TRIES: '5'
  DRY_RUN: 'False'

  # Policy variables
  CATEGORY: 'Productivity'
  POLICY_NAME: 'Adobe Creative Cloud'
  POLICY_GROUP: ''
  POLICY_RUN_COMMAND: '/usr/local/bin/jamf recon'
  POLICY_TEMPLATE: '%NAME%Template.xml'
  POLICY_REPLACE: 'True'
  SELF_SERVICE_INSTALL_BUTTON_TEXT: 'Install'
  SELF_SERVICE_REINSTALL_BUTTON_TEXT: 'Reinstall'
  SELF_SERVICE_DISPLAY_NAME: '%POLICY_NAME% %version%'
  SELF_SERVICE_DESCRIPTION: 'Access everything Creative Cloud has to offer, right from your desktop. From your apps to your work and more.

**This requires a corporate supplied account to access.**'

Process:
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Arguments:
      policy_name: '%POLICY_NAME%'
      policy_template: '%POLICY_TEMPLATE%'
      replace_policy: '%POLICY_REPLACE%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
