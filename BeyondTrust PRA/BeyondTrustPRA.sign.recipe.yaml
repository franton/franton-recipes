Description: Signing recipe for BeyondTrust PRA
Identifier: com.github.franton.sign.BeyondTrustPRA
ParentRecipe: com.github.franton.pkg.BeyondTrustPRA
MinimumVersion: '2.9'

Input:
  NAME: BeyondTrustPRA
  SIGNINGCERTIFICATE: "PLACE SIGNING CERT NAME HERE - COPY NAME FROM YOUR KEYCHAIN ENTRY"
  CORP_ID: CHANGE-THIS
  TENANT: "change-this.url.com"
  JUMP_GROUP: "generic"
  URL: "https://%TENANT%/download_client_connector?jc=%JUMP_GROUP%&p=mac-osx-x86"
  APP_NAME: "Open To Deploy Jump Client.app"
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: com.github.franton.SharedProcessors/PkgSigner
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
      signing_cert: "%SIGNINGCERTIFICATE%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/%NAME%-%version%-unsigned.pkg'
