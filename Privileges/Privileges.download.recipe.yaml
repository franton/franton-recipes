Description: Downloads latest SAP Privileges.
Identifier: com.github.franton.download.Privileges
MinimumVersion: '2.9'

Input:
  NAME: Privileges
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments: 
      asset_regex: ".*\\.pkg$"
      github_repo: "SAP/macOS-enterprise-privileges"
      latest_only: true

  - Processor: URLDownloader
    Arguments:
      url: "%url%"
      download_dir: "%RECIPE_CACHE_DIR%"
      filename: "%NAME%-%version%.pkg"

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments: 
      input_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
      expected_authority_names: 
        - "Developer ID Installer: SAP SE (7R5ZEU67FQ)"
        - "Developer ID Certification Authority"
        - "Apple Root CA"
