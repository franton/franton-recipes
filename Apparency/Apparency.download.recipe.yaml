Description: Downloads latest Apparency disk image file.
Identifier: com.github.franton.download.Apparency
MinimumVersion: '2.9'

Input:
  NAME: Apparency
  URL: 'https://www.mothersruin.com/software/downloads/Apparency.dmg'
  DOWNLOAD_MISSING_FILE: ''
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: URLDownloader
    Arguments:
      DOWNLOAD_MISSING_FILE: '%DOWNLOAD_MISSING_FILE%'
      prefetch_filename: True
      url: '%URL%'

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments: 
      input_path: "%RECIPE_CACHE_DIR%/downloads/%NAME%.dmg/Apparency.app"
      requirement: 'anchor apple generic and identifier "com.mothersruin.Apparency" and (certificate leaf[field.1.2.840.113635.100.6.1.9] /* exists */ or certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = "936EB786NH")'
