Description: Generates the icon from Apparency
Identifier: com.github.franton.icon.Apparency
ParentRecipe: com.github.franton.download.Apparency
MinimumVersion: '2.9'

Input:
  NAME: Apparency
  EXCLUDE: ''
  SIZE: ''
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: Versioner
    Arguments:
      input_plist_path: "%pathname%/Apparency.app/Contents/Info.plist"

  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/%version%"
      pkgdirs: {}

  - Processor: com.github.franton.SharedProcessors/IconGenerator
    Arguments:
      file_path: "%pathname%/Apparency.app"
      exclude: '%EXCLUDE%'
      name_prefix: '%NAME%'
      output_path: "%RECIPE_CACHE_DIR%/%version%"
      size: "%SIZE%"
