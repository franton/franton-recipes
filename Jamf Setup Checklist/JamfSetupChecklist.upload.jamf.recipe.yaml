Description: Uploads custom pkg of latest Jamf Setup Checklist
Identifier: com.github.franton.upload.jamf.JamfSetupChecklist
ParentRecipe: com.github.franton.pkg.JamfSetupChecklist
MinimumVersion: '2.9'

Input:
  NAME: JamfSetupChecklist
  EXCLUDE: ''
  SIZE: ''
  CORP_ID: ''   # NOTE: Replace folder name in PkgRootCreator step!!!!
  LEGALFILE_PATH: ""  # Set a folder name here to copy any legal warning files you require into the pkg.
  SIGNINGCERTIFICATE: ''
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'True'

  # Upload variable
  CATEGORY: ''
  
  # Processor variables
  REMOVE_OLD_PACKAGES: 'True'
  PKG_TO_KEEP: '2'
  PKG_NAME_MATCH: '%NAME%-'  
  SLEEP: '1'
  MAX_TRIES: '5'
  DRY_RUN: 'False'

  # NOTE: Use https://github.com/grahampugh/jamf-upload/wiki/Credentials for Jamf Credential storage.

Process:
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: "%CATEGORY%"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageUploader
    Arguments:
      pkg_category: '%CATEGORY%'
      pkg_info: '%pkg_path%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
     
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageCleaner
    Arguments:
      pkg_name_match: '%PKG_NAME_MATCH%'
      versions_to_keep: '%PKG_TO_KEEP%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
