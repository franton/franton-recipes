Description: Uploads Swift Dialog pkg to Jamf
Identifier: com.github.franton.upload.jamf.SwiftDialog
ParentRecipe: com.github.franton.pkg.SwiftDialog
MinimumVersion: '2.9'

Input:
  NAME: swiftDialog
  EXCLUDE: 'ua'
  SIZE: '512'
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

  # Jamf Setup Manager Policy
  JSM_CATEGORY: ''
  
  # Processor variables
  REMOVE_OLD_PACKAGES: 'True'
  PKG_TO_KEEP: '2'
  PKG_NAME_MATCH: '%NAME%-'  
  SLEEP: '1'
  MAX_TRIES: '5'
  DRY_RUN: 'False'

  # NOTE: Use https://github.com/grahampugh/jamf-upload/wiki/Credentials for Jamf Credential storage.

Process:
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: "%JSM_CATEGORY%"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageUploader
    Arguments:
      pkg_category: '%JSM_CATEGORY%'
      pkg_info: '%RECIPE_CACHE_DIR%/%version%/%NAME%-%version%.pkg'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
      
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageCleaner
    Arguments:
      pkg_name_match: '%PKG_NAME_MATCH%'
      versions_to_keep: '%PKG_TO_KEEP%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
