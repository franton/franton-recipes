Description: Downloads latest Swift Dialog.
Identifier: com.github.franton.download.SwiftDialog
MinimumVersion: '2.9'

Input:
  NAME: swiftDialog
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments: 
      asset_regex: ".*\\.pkg$"
      github_repo: "swiftDialog/swiftDialog"
      latest_only: true

  - Processor: URLDownloader
    Arguments:
      url: "%url%"
      filename: "%NAME%-%version%.pkg"

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments: 
      input_path: "%pathname%"
      expected_authority_names: 
        - "Developer ID Application: Commonwealth Scientific and Industrial Research Organisation (PWA5E9TQ59)"
        - "Developer ID Certification Authority"
        - "Apple Root CA"
