Description: Jamf policy recipe for NexThink Collector installer
Identifier: com.github.franton.policy.jamf.NexThinkCollector-Installer
ParentRecipe: com.github.franton.upload.jamf.NexThinkCollector-Installer
MinimumVersion: '2.9'

Input:
  NAME: NexThinkCollector-Installer
  DMG: Nexthink_Collector.dmg
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'
  
  # Package and signing variables
  CORP_ID: ""
  SIGNINGCERTIFICATE: ""

  # Icon recipe settings
  SIZE: ''
  EXCLUDE: ''

  # Processor variables
  REMOVE_OLD_PACKAGES: 'True'
  PKG_TO_KEEP: '2'
  PKG_NAME_MATCH: '%NAME%-'
  SLEEP: '1'
  MAX_TRIES: '5'
  DRY_RUN: 'False'

  # Jamf Setup Manager settings
  JSM_POLICY_NAME: 'Install NexThink Collector'
  JSM_POLICY_TEMPLATE: '%NAME%-JSMTemplate.xml'
  JSM_CUSTOM_TRIGGER: ''
  JSM_CATEGORY: ''
  JSM_POLICY_GROUP: ''
  JSM_POLICY_REPLACE: 'True'

  # Self Service Policy settings
  SELF_SERVICE_POLICY_NAME: 'NexThink Collector'
  SELF_SERVICE_POLICY_TEMPLATE: '%NAME%-SelfServiceTemplate.xml'
  SELF_SERVICE_CATEGORY: ''
  SELF_SERVICE_POLICY_GROUP: ''
  SELF_SERVICE_POLICY_REPLACE: 'True'

  SELF_SERVICE_INSTALL_BUTTON_TEXT: 'Install'
  SELF_SERVICE_REINSTALL_BUTTON_TEXT: 'Reinstall'
  SELF_SERVICE_DISPLAY_NAME: 'NexThink Collector %version%'
  SELF_SERVICE_DESCRIPTION: 'NexThink Collector is an IT tool that helps collect data to prevent device issues'
  SELF_SERVICE_RUN_COMMAND: '/usr/local/bin/jamf recon'

Process:
  # Upload the Jamf Setup Manager policy
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Arguments:
      policy_name: '%JSM_POLICY_NAME%'
      policy_template: '%JSM_POLICY_TEMPLATE%'
      replace_policy: '%JSM_POLICY_REPLACE%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'

  # Upload the Self Service policy
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Arguments:
      policy_name: '%SELF_SERVICE_POLICY_NAME%'
      policy_template: '%SELF_SERVICE_POLICY_TEMPLATE%'
      replace_policy: '%SELF_SERVICE_POLICY_REPLACE%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
