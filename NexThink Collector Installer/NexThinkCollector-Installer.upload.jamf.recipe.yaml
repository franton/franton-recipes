Description: Jamf upload recipe for NexThink Collector installer
Identifier: com.github.franton.upload.jamf.NexThinkCollector-Installer
ParentRecipe: com.github.franton.sign.NexThinkCollector-Installer
MinimumVersion: '2.9'

Input:
  NAME: NexThinkCollector-Installer
  DMG: Nexthink_Collector.dmg
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'
  
  # Package and signing variables
  CORP_ID: ""
  SIGNINGCERTIFICATE: ""

  # Icon recipe settings
  SIZE: ''
  EXCLUDE: ''

  # NexThink switches for csi.app go here. They apparently like to completely change these on a regular basis.
  # These are the current switch names taken from their MSI table as of 15th October 2026
  DATA_OVER_TCP: ''
  USE_ASSIGNMENT: ''
  CRD_PORT: ''
  DRV_IP: ''
  EXECUTION_POLICY: ''
  WINDOW_FOCUS_TIME_MONITORING: ''
  ANONYMIZE_WIFI_NETWORK: ''
  DOMAIN_NAME_REPORTING: ''

  # NexThink registration details
  CUSTOMER_KEY_FILE: "nexthink-customer-key.txt"
  CUSTOMER_KEY_DATA: ""

  # Processor variables
  REMOVE_OLD_PACKAGES: 'True'
  PKG_TO_KEEP: '2'
  PKG_NAME_MATCH: '%NAME%-'
  SLEEP: '1'
  MAX_TRIES: '5'
  DRY_RUN: 'False'

  SELF_SERVICE_CATEGORY: ''

Process:
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: "%SELF_SERVICE_CATEGORY%"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageUploader
    Arguments:
      pkg_category: '%SELF_SERVICE_CATEGORY%'
      pkg_info: '%pkg_path%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
     
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageCleaner
    Arguments:
      pkg_name_match: '%PKG_NAME_MATCH%'
      versions_to_keep: '%PKG_TO_KEEP%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
