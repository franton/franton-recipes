Description: Signing recipe for YubiKey Authenticator
Identifier: com.github.franton.sign.Yubikey-Authenticator
ParentRecipe: com.github.franton.pkg.Yubikey-Authenticator
MinimumVersion: '2.9'

Input:
  NAME: YubiKeyAuthenticator
  SIGNINGCERTIFICATE: "PLACE SIGNING CERT NAME HERE - COPY NAME FROM YOUR KEYCHAIN ENTRY"
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: com.github.rtrouton.SharedProcessors/PkgSigner
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%"
      signing_cert: "%SIGNINGCERTIFICATE%"
