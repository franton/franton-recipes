Description: Download recipe for YubiKey Authenticator
Identifier: com.github.franton.download.Yubikey-Authenticator
MinimumVersion: '2.9'

Input:
  NAME: YubiKeyAuthenticator

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments: 
      asset_regex: ".*\\.dmg$"
      github_repo: "Yubico/yubioath-flutter"
      latest_only: true

  - Processor: URLDownloader
    Arguments: 
      url: "%url%"
      filename: "%NAME%-%version%.dmg"

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%pathname%/Yubico Authenticator.app"
      requirement: 'identifier "com.yubico.yubioath" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = LQA3CS5MM7'
