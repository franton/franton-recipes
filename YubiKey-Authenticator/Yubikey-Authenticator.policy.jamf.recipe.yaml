Description: Creates/Updates Yubikey Authenticator Self Service policy in Jamf.
Identifier: com.github.franton.policy.jamf.Yubikey-Authenticator
ParentRecipe: com.github.franton.upload.jamf.Yubikey-Authenticator
MinimumVersion: '2.9'

Input:
  NAME: 'YubikeyAuthenticator'
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'
  SIGNINGCERTIFICATE: ''

  # Icon settings
  EXCLUDE: 'ua'
  SIZE: '512'

  # Generic Policy variables
  POLICY_REPLACE: 'True'

  # Jamf Setup Manager Policy
  JSM_CATEGORY: ''
  JSM_CUSTOM_TRIGGER: ''
  JSM_POLICY_NAME: ''
  JSM_POLICY_TEMPLATE: '%NAME%JSMTemplate.xml'
  JSM_POLICY_SCOPE: ''

  # Self Service Policy
  SELF_SERVICE_CATEGORY: ''
  SELF_SERVICE_DESCRIPTION: ''
  SELF_SERVICE_POLICY_NAME: ''
  SELF_SERVICE_POLICY_TEMPLATE: '%NAME%SelfServiceTemplate.xml'
  SELF_SERVICE_POLICY_SCOPE_A: ''
  SELF_SERVICE_POLICY_SCOPE_B: ''
  SELF_SERVICE_INSTALL_BUTTON_TEXT: 'Install'
  SELF_SERVICE_REINSTALL_BUTTON_TEXT: 'Reinstall'
  SELF_SERVICE_ICON: '%NAME%_install.png'
  SELF_SERVICE_DISPLAY_NAME: '%SELF_SERVICE_POLICY_NAME% %version%'
  SELF_SERVICE_POLICY_RUN_COMMAND: '/usr/local/bin/jamf recon'

  # Processor variables
  REMOVE_OLD_PACKAGES: 'True'
  PKG_TO_KEEP: '2'
  PKG_NAME_MATCH: '%NAME%-'  
  SLEEP: '1'
  MAX_TRIES: '5'
  DRY_RUN: 'False'

  # NOTE: Use https://github.com/grahampugh/jamf-upload/wiki/Credentials for Jamf Credential storage.

Process:
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Arguments:
      policy_name: '%POLICY_NAME%'
      policy_template: '%POLICY_TEMPLATE%'
      replace_policy: '%POLICY_REPLACE%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
