Description: Installer pkg creation recipe for YubiKey Authenticator
Identifier: com.github.franton.pkg.Yubikey-Authenticator
MinimumVersion: '2.9'

Input:
  NAME: YubiKeyAuthenticator

Process:
  - Processor: AppDmgVersioner
    Arguments:
      dmg_path: %pathname%

  - Processor: PkgRootCreator
    Arguments:
      pkgroot: %RECIPE_CACHE_DIR%/%NAME%
      pkgdirs:
        Applications: 0775 

  - Processor: Copier
    Arguments:
     source_path: %pathname%/%app_name%
     destination_path: %pkgroot%/Applications/%app_name%

  - Processor: PkgCreator
    Arguments:
      pkg_request:
        pkgname: %NAME%-%version%
        version: %version%
        id: %bundleid%
        chown:
          path: Applications 
          user: root
          group: admin

  - Processor: PathDeleter
    Arguments:
      path_list:
        '%RECIPE_CACHE_DIR%/%NAME%'
        '%RECIPE_CACHE_DIR%/downloads'
