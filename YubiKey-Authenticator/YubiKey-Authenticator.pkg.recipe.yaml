Description: Installer pkg creation recipe for YubiKey Authenticator
Identifier: com.github.franton.pkg.Yubikey-Authenticator
ParentRecipe: com.github.franton.icon.Yubikey-Authenticator
MinimumVersion: '2.9'

Input:
  NAME: YubiKeyAuthenticator
  SIZE: ''
  EXCLUDE: ''
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: AppPkgCreator 
    Arguments:
      app_path: "%pathname%/Yubico Authenticator.app"
      pkg_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%-%version%.pkg"
      force_pkg_build: True

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/downloads'
