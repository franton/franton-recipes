Description: Installer pkg creation recipe for YubiKey Authenticator
Identifier: com.github.franton.pkg.Yubikey-Authenticator
ParentRecipe: com.github.franton.download.Yubikey-Authenticator
MinimumVersion: '2.9'

Input:
  NAME: YubiKeyAuthenticator

Process:
  - Processor: AppDmgVersioner 
    Arguments:
      dmg_path: "%pathname%"

  - Processor: PkgRootCreator
    Arguments:
      pkgdirs:
        Applications: "0775"
      pkgroot: "%RECIPE_CACHE_DIR%/payload"

  - Processor: Copier
    Arguments:
      destination_path: "%pkgroot%/Applications/Yubico Authenticator.app"
      source_path: "%pathname%/Yubico Authenticator.app"

  - Processor: PkgCreator
    Arguments:
      pkg_request:
        chown:
          - path: Applications
            group: admin
            user: root
            mode: "0755"
      id: "com.yubico.yubioath"
      options: "purge_ds_store"
      pkgdir: "%RECIPE_CACHE_DIR%"
      pkgname: "%NAME-%version%"
