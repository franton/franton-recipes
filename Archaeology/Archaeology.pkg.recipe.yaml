Description: Generates a pkg for Archaeology.
Identifier: com.github.franton.pkg.Archaeology
ParentRecipe: com.github.franton.icon.Archaeology
MinimumVersion: '2.9'

Input:
  NAME: Archaeology
  EXCLUDE: ''
  SIZE: ''
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: AppPkgCreator 
    Arguments:
      app_path: "%pathname%/Archaeology.app"
      pkg_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%-%version%.pkg"
      force_pkg_build: True

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/downloads'
