Description: Creates/Updates Google Chrome Self Service policy in Jamf.
Identifier: com.github.franton.policy.jamf.GoogleChromeEnterprise
ParentRecipe: com.github.franton.upload.jamf.GoogleChromeEnterprise
MinimumVersion: '2.9'

Input:
  NAME: 'GoogleChrome'
  CHANNEL: 'stable'       # stable or beta
  EXCLUDE: 'ua'
  SIZE: '512'
  URL: 'https://dl.google.com/chrome/mac/%CHANNEL%/'
  TOS: 'accept_tos%3Dhttps%253A%252F%252Fwww.google.com%252Fintl%252Fen_ph%252Fchrome%252Fterms%252F%26_and_accept_tos%3Dhttps%253A%252F%252Fpolicies.google.com%252Fterms/googlechrome.pkg'
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'
 
  # Policy variables 
  CATEGORY: 'Browsers'
  POLICY_NAME: 'Google Chrome'
  POLICY_GROUP: 'All Managed Clients'
  POLICY_RUN_COMMAND: '/usr/local/bin/jamf recon'
  POLICY_TEMPLATE: '%NAME%Template.xml'
  POLICY_REPLACE: 'True'
  SELF_SERVICE_INSTALL_BUTTON_TEXT: 'Install'
  SELF_SERVICE_REINSTALL_BUTTON_TEXT: 'Reinstall'
  SELF_SERVICE_ICON: '%NAME%_install.png'
  SELF_SERVICE_DISPLAY_NAME: '%POLICY_NAME% %version%'
  SELF_SERVICE_DESCRIPTION: 'Chrome is the official web browser from Google, built to be fast, secure, and customizable.'

  # Processor variables
  REMOVE_OLD_PACKAGES: 'True'
  PKG_TO_KEEP: '2'
  PKG_NAME_MATCH: '%NAME%-'
  
  SLEEP: '1'
  MAX_TRIES: '5'
  DRY_RUN: 'False'

  # NOTE: Use https://github.com/grahampugh/jamf-upload/wiki/Credentials for Jamf Credential storage.

Process:
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Arguments:
      policy_name: '%POLICY_NAME%'
      policy_template: '%POLICY_TEMPLATE%'
      replace_policy: '%POLICY_REPLACE%'
      icon: "%RECIPE_CACHE_DIR%/%version%/%SELF_SERVICE_ICON%"
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
