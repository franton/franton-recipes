Description: Pkg recipe for Box Tools
Identifier: com.github.franton.pkg.BoxTools
ParentRecipe: com.github.franton.download.BoxTools
MinimumVersion: '2.9'

Input:
  NAME: BoxTools
  SOFTWARE_TITLE: BoxToolsInstaller.pkg
  CORP_ID: CHANGE-THIS
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      flat_pkg_path: "%pathname%"
      destination_path: "%RECIPE_CACHE_DIR%/outerunpack"

  - Processor: PkgPayloadUnpacker
    Arguments:
      pkg_payload_path: "%RECIPE_CACHE_DIR%/outerunpack/BoxEdit.pkg/Payload"
      destination_path: "%RECIPE_CACHE_DIR%/unpack"

  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/unpack/Box Edit.app/Contents/Info.plist"

  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
      pkgdirs:
        tmp: "0777"
        Scripts: "0755"

  - Processor: FileCreator
    Arguments:
      file_path: "%RECIPE_CACHE_DIR%/Scripts/postinstall.sh"
      file_mode: "0755"
      file_content: |
         #!/bin/zsh --no-rcs

         # Install Box Tools

         # Clear any pkg quarantine attributes
         /usr/bin/find "$( /usr/bin/find /private/tmp -maxdepth 1 \( -iname \*\.pkg -o -iname \*\.mpkg \) )" -maxdepth 1 \( -iname \*\.pkg -o -iname \*\.mpkg \) -exec /usr/bin/xattr -cr {} +

         # Work out current user. Abort install if one isn't present.
         usernames=()
         usernames+=( $( /usr/bin/dscl /Local/Default -list /Users uid | /usr/bin/awk '$2 >= 501 { print $1 }' | /usr/bin/grep -v -E "^(_|mfe)" ) )

         # Go through and terminate all processes
         processnames=('Box Helper.app' 'Box Edit.app' 'Box Device Trust.app' 'Box Local Com Server.app' 'Box Tools Custom Apps.app' 'Box.app')
         for process in $processnames;
         do
           pids=$( /bin/ps ax | /usr/bin/grep -i "$process" | /usr/bin/grep -v grep | /usr/bin/awk '{ print $1 }' )
           [ ! -z "$pids" ] && echo $pids | /usr/bin/xargs kill -9
           unset pids
         done

         # Find and install the pkg in that folder and install as the user
         for account in $usernames;
         do
           userid=$( /usr/bin/id -u $account )
           pkg=$( /usr/bin/find /private/tmp -maxdepth 1 \( -iname \*\.pkg -o -iname \*\.mpkg \) )
           /bin/rm -rf /Users/$account/Library/Application\ Support/Box/Box\ Edit
           /bin/launchctl asuser $userid sudo -iu $account /usr/sbin/installer -verboseR -target CurrentUserHomeDirectory -pkg $pkg
         done

         /bin/rm -rf ${pkg}

         exit 0

  - Processor: PkgCopier
    Arguments:
      source_pkg: "%pathname%"
      pkg_path: "%RECIPE_CACHE_DIR%/pkgroot/tmp/%SOFTWARE_TITLE%"

  - Processor: PkgCreator
    Arguments:
      pkg_request: 
        pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
        pkgdir: "%RECIPE_CACHE_DIR%"
        pkgname: "%NAME%-%version%"
        pkgtype: flat
        id: "com.%CORP_ID%.%NAME%"
        version: "%version%"
        chown:
          - path: tmp
            user: root
            group: wheel
            mode: "0777"
        scripts: "%RECIPE_CACHE_DIR%/Scripts"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/downloads'
        - '%RECIPE_CACHE_DIR%/outerunpack'
        - '%RECIPE_CACHE_DIR%/unpack'
        - '%RECIPE_CACHE_DIR%/pkgroot'
        - '%RECIPE_CACHE_DIR%/Scripts'
