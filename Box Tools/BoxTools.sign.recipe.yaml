Description: Signing recipe for Box Tools
Identifier: com.github.franton.sign.BoxTools
ParentRecipe: com.github.franton.pkg.BoxTools
MinimumVersion: '2.9'

Input:
  NAME: BoxTools
  SIGNINGCERTIFICATE: ''
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'SIGNINGCERTIFICATE == nil'

  - Processor: com.github.franton.SharedProcessors/PkgSigner
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%-%version%.pkg"
      signing_cert: "%SIGNINGCERTIFICATE%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/%NAME%-%version%-unsigned.pkg'
