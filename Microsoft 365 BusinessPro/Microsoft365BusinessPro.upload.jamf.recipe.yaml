Description: Uploads Microsoft 365 Business Pro Suite pkg
Identifier: com.github.franton.upload.jamf.Microsoft365BusinessPro
ParentRecipe: com.github.franton.pkg.Microsoft365BusinessPro
MinimumVersion: '2.9'

Input:
  NAME: Microsoft365BusinessPro
  MS_ID: '2009112'
  MS_URL: 'https://go.microsoft.com/fwlink/?linkid='
  MS_RELEASE_URL: 'https://learn.microsoft.com/en-us/officeupdates/release-notes-office-for-mac'
  EXCLUDE: 'ua'
  SIZE: '512'
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

  # Self Service Policy
  SELF_SERVICE_CATEGORY: ''
  SELF_SERVICE_ICON: '%NAME%_install.png'

  # Processor variables
  REMOVE_OLD_PACKAGES: 'True'
  PKG_TO_KEEP: '2'
  PKG_NAME_MATCH: '%NAME%-'  
  SLEEP: '1'
  MAX_TRIES: '5'
  DRY_RUN: 'False'

  # NOTE: Use https://github.com/grahampugh/jamf-upload/wiki/Credentials for Jamf Credential storage.

Process:
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: "%SELF_SERVICE_CATEGORY%"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageUploader
    Arguments:
      pkg_category: '%SELF_SERVICE_CATEGORY%'
      pkg_info: '%pkg_path%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'

  - Processor: FileFinder
    Arguments:
      pattern: '%RECIPE_CACHE_DIR%/%version%/%SELF_SERVICE_ICON%'
      
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageCleaner
    Arguments:
      pkg_name_match: '%PKG_NAME_MATCH%'
      versions_to_keep: '%PKG_TO_KEEP%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
