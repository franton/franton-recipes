Description: Versions the Microsoft 365 Business Pro Suite pkg
Identifier: com.github.franton.pkg.Microsoft365BusinessPro
ParentRecipe: com.github.franton.icon.Microsoft365BusinessPro
MinimumVersion: '2.9'

Input:
  NAME: Microsoft365BusinessPro
  MS_ID: '2009112'
  MS_URL: 'https://go.microsoft.com/fwlink/?linkid='
  MS_RELEASE_URL: 'https://learn.microsoft.com/en-us/officeupdates/release-notes-office-for-mac'
  EXCLUDE: ''
  SIZE: ''
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: EndOfCheckPhase

  - Processor: PkgCopier
    Arguments:
      source_pkg: "%pathname%"
      pkg_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%-%version%.pkg"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/downloads'
