Description: Icon creation recipe for NexThink Collector
Identifier: com.github.franton.icon.NexThinkCollector
ParentRecipe: com.github.franton.download.NexThinkCollector
MinimumVersion: '2.9'

Input:
  NAME: NexThinkCollector
  DMG: Nexthink_Collector.dmg
  SIZE: ''
  EXCLUDE: ''
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: FlatPkgUnpacker
    Arguments:
      flat_pkg_path: "%pathname%/Nexthink_Collector.pkg"
      destination_path: "%RECIPE_CACHE_DIR%/outerunpack"

  - Processor: PkgPayloadUnpacker
    Arguments:
      pkg_payload_path: "%RECIPE_CACHE_DIR%/outerunpack/nxtsvc.pkg/Payload"
      destination_path: "%RECIPE_CACHE_DIR%/unpack"

  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/%version%"
      pkgdirs: {}

  - Processor: com.github.franton.SharedProcessors/IconGenerator
    Arguments:
      file_path: "%RECIPE_CACHE_DIR%/unpack/nxtsvc.app"
      exclude: "%EXCLUDE%"
      name_prefix: "%NAME%"
      output_path: "%RECIPE_CACHE_DIR%/%version%"
      size: "%SIZE%"
