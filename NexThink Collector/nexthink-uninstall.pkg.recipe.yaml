Description: Packages current release version of NexThink Collector as an uninstaller.
Identifier: com.github.franton.pkg.NexThinkCollector-Uninstall
ParentRecipe: com.github.franton.download.NexThinkCollector
MinimumVersion: '2.9'
Comment: Create an override and set the variables in an override. DO NOT USE this recipe directly.

Input:
  NAME: NexThinkCollector-Uninstaller
  DMG: Nexthink_Collector.dmg
  CORP_ID: replace-me
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/Scripts"
      pkgdirs: {}

  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
      pkgdirs: {}

  - Processor: Copier
    Arguments:
      source_path: "%pathname%/uninstaller"
      destination_path: "%RECIPE_CACHE_DIR%/Scripts/postinstall"

  - Processor: com.github.mlbz521.SharedProcessors/FileMode
    Arguments:
      file_path: "%RECIPE_CACHE_DIR%/Scripts/postinstall"
      file_mode: '0755'

  - Processor: PkgCreator
    Arguments:
      pkg_request: 
        pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
        pkgdir: "%RECIPE_CACHE_DIR%"
        pkgname: "%NAME%-%version%"
        pkgtype: flat
        id: "com.%CORP_ID%.%NAME%-Uninstall"
        version: "%version%"
        scripts: "Scripts"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/downloads'
        - '%RECIPE_CACHE_DIR%/Scripts'
        - '%RECIPE_CACHE_DIR%/pkgroot'
