Description: Signing recipe for NexThink Collector packages
Identifier: com.github.franton.sign.NexThinkCollector
ParentRecipe: com.github.franton.pkg.NexThinkCollector
MinimumVersion: '2.9'

Input:
  NAME: NexThinkCollector
  DMG: Nexthink_Collector.dmg
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'
  
  # Package and signing variables
  CORP_ID: ""
  SIGNINGCERTIFICATE: ""

  # Icon recipe settings
  SIZE: ''
  EXCLUDE: ''

  # NexThink switches for csi.app go here. They apparently like to completely change these on a regular basis.
  # These are the current switch names taken from their MSI table as of 15th October 2026
  DATA_OVER_TCP: ''
  USE_ASSIGNMENT: ''
  CRD_PORT: ''
  DRV_IP: ''
  EXECUTION_POLICY: ''
  WINDOW_FOCUS_TIME_MONITORING: ''
  ANONYMIZE_WIFI_NETWORK: ''
  DOMAIN_NAME_REPORTING: ''

  # NexThink registration details
  CUSTOMER_KEY_FILE: "nexthink-customer-key.txt"
  CUSTOMER_KEY_DATA: ""

Process:
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'SIGNINGCERTIFICATE == nil'

  - Processor: com.github.franton.SharedProcessors/PkgSigner
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%-Install-%version%.pkg"
      signing_cert: "%SIGNINGCERTIFICATE%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/%version%/%NAME%-Install-%version%-unsigned.pkg'

  - Processor: com.github.franton.SharedProcessors/PkgSigner
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%-Uninstall-%version%.pkg"
      signing_cert: "%SIGNINGCERTIFICATE%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/%version%/%NAME%-Uninstall-%version%-unsigned.pkg'
