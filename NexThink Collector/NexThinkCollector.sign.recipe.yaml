Description: Signing recipe for NexThink Collector packages
Identifier: com.github.franton.sign.NexThinkCollector
ParentRecipe: com.github.franton.pkg.NexThinkCollector
MinimumVersion: '2.9'

Input:
  NAME: NexThinkCollector
  DMG: Nexthink_Collector.dmg

  CORP_ID: ""
  SIGNINGCERTIFICATE: ""

  CUSTOMER_KEY_FILE: "nexthink-customer-key.txt"
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

  SERVER_ADDRESS: ""
  UDP_PORT: ""
  TCP_PORT: ""
  ENGAGE: "enable"
  DATA_TCP: "enable"
  PROXYPAC_ADDRESS: ''
  PROXY_ADDRESS: ''
  PROXY_PORT: ''
  ASSIGNMENT: "enable"
  REMOTE_ACTIONS: "disabled"
  STRING_TAG: ''
  CUSTOMER_KEY_DATA: ""

Process:
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'SIGNINGCERTIFICATE == nil'

  - Processor: com.github.franton.SharedProcessors/PkgSigner
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-Install-%version%.pkg"
      signing_cert: "%SIGNINGCERTIFICATE%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/%NAME%-Install-%version%-unsigned.pkg'

  - Processor: com.github.franton.SharedProcessors/PkgSigner
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-Uninstall-%version%.pkg"
      signing_cert: "%SIGNINGCERTIFICATE%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/%NAME%-Uninstall-%version%-unsigned.pkg'
