Description: Downloads current release version of NexThink Collector.
Identifier: com.github.franton.download.NexThinkCollector
MinimumVersion: "2.9"
Comment: 'Downloads latest NexThink Collector client and provides versioning to downstream recipes.'

Input:
  NAME: NexThinkCollector
  DOWNLOAD_URL: https://download.nexthink.com/releases/latest/OSX_Collector/Nexthink_Collector.dmg

Process:
  - Processor: URLDownloader
    Arguments:
      prefetch_filename: true
      url: "%DOWNLOAD_URL%"
  
  - Processor: EndOfCheckPhase

  - Processor: Versioner
    Arguments:
      input_plist_path: "%pathname%/csi.app/Contents/Info.plist"
      plist_version_key: CFBundleVersion

  - Processor: CodeSignatureVerifier
    Arguments:
    Arguments:
      requirement: 'identifier "com.nexthink.collector.installer.csi" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = PDEKAZ43QL'
      input_path: "%pathname%/csi.app"
