Description: Signing recipe for NexThink Collector
Identifier: com.github.franton.sign.NexThinkCollector-Install
ParentRecipe: com.github.franton.pkg.NexThinkCollector-Install
MinimumVersion: '2.9'

Input:
  NAME: NexThinkCollector
  SIGNINGCERTIFICATE: ''
  DMG: Nexthink_Collector.dmg
  CORP_ID: intuitive
  CUSTOMER_KEY_FILE: "nexthink-customer-key.txt"
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'
  SERVER_ADDRESS: ""
  UDP_PORT: ""
  TCP_PORT: ""
  ENGAGE: "enable"
  DATA_TCP: "enable"
  PROXYPAC_ADDRESS: ''
  PROXY_ADDRESS: ''
  PROXY_PORT: ''
  ASSIGNMENT: "enable"
  REMOTE_ACTIONS: "disabled"
  STRING_TAG: ''
  CUSTOMER_KEY_DATA: ""
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'SIGNINGCERTIFICATE == nil'

  - Processor: com.github.rtrouton.SharedProcessors/PkgSigner
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
      signing_cert: "%SIGNINGCERTIFICATE%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/%NAME%-%version%-unsigned.pkg'
