Description: Updates NexThink Collector uninstall policy
Identifier: com.github.franton.uninstall.policy.jamf.NexThinkCollector
ParentRecipe: com.github.franton.uninstall.upload.jamf.NexThinkCollector
MinimumVersion: '2.9'

Input:
  NAME: NexThinkCollector
  DMG: Nexthink_Collector.dmg
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'
  
  # Package and signing variables
  CORP_ID: ''
  SIGNINGCERTIFICATE: ''

  # Icon recipe settings
  SIZE: '512'
  EXCLUDE: 'a'
 
  # Generic Policy variables
  POLICY_REPLACE: 'True'
  
  # Jamf details
  SELF_SERVICE_CATEGORY: ''
  SELF_SERVICE_POLICY_NAME: ''
  SELF_SERVICE_POLICY_TEMPLATE: '%NAME%UninstallSelfServiceTemplate.xml'
  SELF_SERVICE_POLICY_SCOPE: ''

  SELF_SERVICE_INSTALL_BUTTON_TEXT: 'Install'
  SELF_SERVICE_REINSTALL_BUTTON_TEXT: 'Reinstall'
  SELF_SERVICE_DISPLAY_NAME: 'NexThink Collector %version%'
  SELF_SERVICE_DESCRIPTION: 'Removes the NexThink agent from this device'
  SELF_SERVICE_RUN_COMMAND: '/usr/local/bin/jamf recon'

  # Processor variables
  REMOVE_OLD_PACKAGES: 'True'
  PKG_TO_KEEP: '2'
  PKG_NAME_MATCH: '%NAME%-Uninstall-'
  SLEEP: '1'
  MAX_TRIES: '5'
  DRY_RUN: 'False'

Process:
  # Jamf Setup Manager policy
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: "%SELF_SERVICE_CATEGORY%"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Arguments:
      policy_name: '%SELF_SERVICE_POLICY_NAME%'
      policy_template: '%SELF_SERVICE_POLICY_TEMPLATE%'
      replace_policy: '%POLICY_REPLACE%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
