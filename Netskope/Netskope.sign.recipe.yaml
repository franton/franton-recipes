Description: Signing recipe for Netskope Client
Identifier: com.github.franton.sign.Netskope
ParentRecipe: com.github.franton.pkg.Netskope
MinimumVersion: '2.9'

Input:
  NAME: Netskope
  SIGNINGCERTIFICATE: "PLACE SIGNING CERT NAME HERE - COPY NAME FROM YOUR KEYCHAIN ENTRY"
  TENANT: ''
  TENANT_URL: "addon-%TENANT%.goskope.com"
  HOSTNAME: "download-%TENANT%.goskope.com"
  ORG_ID: ''
  AUTH_TOKEN: ''
  ENCRYPT_TOKEN: ''
  UNINSTALL_PWD: ''
  JAMF_CLIENTID: ''
  JAMF_SECRET: ''
  DOWNLOAD_URL: "https://%HOSTNAME%/dlr/mac/get"
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: com.github.rtrouton.SharedProcessors/PkgSigner
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
      signing_cert: "%SIGNINGCERTIFICATE%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/%NAME%-%version%-unsigned.pkg'
