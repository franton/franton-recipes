Description: Creates current release pkg of Xcodes.
Identifier: com.github.franton.pkg.Xcodes
ParentRecipe: com.github.franton.icon.Xcodes
MinimumVersion: "2.9"
Comment: ''

Input:
  NAME: Xcodes
  PURGE_DESTINATION: 'False'

  # Package settings
  CORP_ID: 'test'

  # Icon recipe settings
  EXCLUDE: 'ua'
  SIZE: '512'

  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
# Prereqs checks before proceeding
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'CORP_ID == nil'

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
      pkgdirs:
         Applications: "0775"
         Library: "0755"
         Library/PrivilegedHelperTools: "0755"
      
  - Processor: Copier
    Arguments:
      source_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%.app"
      destination_path: "%RECIPE_CACHE_DIR%/pkgroot/Applications/%NAME%.app"

  - Processor: Copier
    Arguments:
      source_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%.app/Contents/Library/LaunchServices/com.xcodesorg.xcodesapp.Helper"
      destination_path: "%RECIPE_CACHE_DIR%/pkgroot/Library/PrivilegedHelperTools/com.xcodesorg.xcodesapp.Helper"

  - Processor: com.github.franton.SharedProcessors/FileMode
    Arguments:
      file_path: "%RECIPE_CACHE_DIR%/pkgroot/Library/PrivilegedHelperTools/com.xcodesorg.xcodesapp.Helper"
      file_mode: '0755'

  - Processor: PkgCreator
    Arguments:
      pkg_request: 
        pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
        pkgdir: "%RECIPE_CACHE_DIR%/%version%"
        pkgname: "%NAME%-%version%"
        pkgtype: flat
        id: "com.%CORP_ID%.%NAME%"
        version: "%version%"
        chown:
          - path: Applications
            user: root
            group: wheel
            mode: "0775"
          - path: "Library/PrivilegedHelperTools/com.xcodesorg.xcodesapp.Helper"
            user: root
            group: wheel
            mode: "0544"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/%version%/%NAME%.app'
        - '%RECIPE_CACHE_DIR%/downloads'
        - '%RECIPE_CACHE_DIR%/pkgroot'
