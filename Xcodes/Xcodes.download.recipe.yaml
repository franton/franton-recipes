Description: Downloads latest Xcodes
Identifier: com.github.franton.download.Xcodes
MinimumVersion: '2.9'

Input:
  NAME: Xcodes
  PURGE_DESTINATION: 'False'
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments: 
      asset_regex: ".*\\.zip$"
      github_repo: "XcodesOrg/XcodesApp"
      latest_only: true

  - Processor: URLDownloader
    Arguments:
      url: "%url%"
      download_dir: "%RECIPE_CACHE_DIR%"
      filename: "%NAME%.zip"

#  - Processor: Unarchiver
#    Arguments:
#      archive_path: '%pathname%'
#      destination_path: '%RECIPE_CACHE_DIR%'
#      purge_destination: '%PURGE_DESTINATION%'

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'
