Description: Downloads latest Xcodes
Identifier: com.github.franton.download.Xcodes
MinimumVersion: '2.9'

Input:
  NAME: Xcodes
  PURGE_DESTINATION: 'False'
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments: 
      asset_regex: ".*\\.zip$"
      github_repo: "XcodesOrg/XcodesApp"
      latest_only: true

  - Processor: URLDownloader
    Arguments:
      url: "%url%"
      filename: "%NAME%-%version%.zip"

  - Processor: Unarchiver
    Arguments:
      archive_path: '%pathname%'
      destination_path: '%RECIPE_CACHE_DIR%/%version%'
      purge_destination: '%PURGE_DESTINATION%'

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments: 
      input_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%.app"
      requirement: 'anchor apple generic and identifier "com.xcodesorg.xcodesapp" and (certificate leaf[field.1.2.840.113635.100.6.1.9] /* exists */ or certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = ZU6GR6B2FY)'
