Description: Generates icon from Tableau Desktop
Identifier: com.github.franton.icon.TableauDesktop
ParentRecipe: com.github.franton.download.TableauDesktop
MinimumVersion: '2.9'

Input:
  NAME: Tableau_Desktop
  EXCLUDE: ''
  SIZE: ''
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      flat_pkg_path: "%pathname%/Tableau Desktop.pkg"
      destination_path: "%RECIPE_CACHE_DIR%/outerunpack"

  - Processor: PkgPayloadUnpacker
    Arguments:
      pkg_payload_path: "%RECIPE_CACHE_DIR%/outerunpack/Tableau App.pkg/Payload"
      destination_path: "%RECIPE_CACHE_DIR%/unpack"

  - Processor: FileFinder
    Arguments:
      pattern: '%RECIPE_CACHE_DIR%/unpack/Tableau Desktop*.app'

  - Processor: Versioner
    Arguments:
      input_plist_path: "%found_filename%/Contents/Info.plist"

  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/%version%"
      pkgdirs: {}

  - Processor: com.github.franton.SharedProcessors/IconGenerator
    Arguments:
      file_path: "%found_filename%"
      exclude: '%EXCLUDE%'
      name_prefix: '%NAME%'
      output_path: "%RECIPE_CACHE_DIR%/%version%"
      size: "%SIZE%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/unpack'
        - '%RECIPE_CACHE_DIR%/outerunpack'
