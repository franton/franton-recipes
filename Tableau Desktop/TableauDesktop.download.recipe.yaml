Description: Downloads latest Tableau Desktop disk images for specified version / cpu arch.
Identifier: com.github.franton.download.TableauDesktop
MinimumVersion: '2.9'
Comment: 'Tableau Desktop is usually tied to a specific server version, so this recipe insists that you specify a version for it to work.'

Input:
  NAME: TableauDesktop
  CPU: 'arm64'             # arm64 or x86_64
  DOT_VERSION: ''          # e.g. 2025.3.11
  DASH_VERSION: ''         # e.g. 2025-3-11
  URL: 'https://downloads.tableau.com/esdalt/%DOT_VERSION%/%NAME%-%DASH_VERSION%-%CPU%.dmg'
  DOWNLOAD_MISSING_FILE: ''
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'CPU == False'

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'DOT_VERSION == False'

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'DASH_VERSION == False'

  - Processor: URLDownloader
    Arguments:
      DOWNLOAD_MISSING_FILE: '%DOWNLOAD_MISSING_FILE%'
      prefetch_filename: True
      url: '%URL%'

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      strict_verification: true
      expected_authority_names:
        - 'Developer ID Installer: Tableau Software, LLC (QJ4XPRK37C)'
        - 'Developer ID Certification Authority'
        - 'Apple Root CA'
      input_path: '%pathname%/Tableau Desktop.pkg'
