Description: Downloads latest Tableau Desktop disk images for specified cpu arch.
Identifier: com.github.franton.download.TableauDesktop
MinimumVersion: '2.9'

Input:
  NAME: Tableau Desktop
  DMG: Tableau_Desktop
  CPU: arm64                  # arm64 or x86_64
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  # Shamelessly mostly copied from smithjw's recipe
  # https://github.com/autopkg/smithjw-recipes/blob/master/Tableau/Tableau_Desktop.download.recipe.yaml

  - Processor: URLTextSearcher
    Arguments:
      re_pattern: <a href="(\/.*?)+\/(?P<version>(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+))#.*class="cta">
      url: https://www.tableau.com/support/releases

  - Processor: URLDownloaderPython
    Arguments:
      download_missing_file: '%DOWNLOAD_MISSING_FILE%'
      filename: '%DMG%-%CPU%.dmg'
      url: https://downloads.tableau.com/esdalt/%version%/TableauDesktop-%major%-%minor%-%patch%-%CPU%.dmg

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      strict_verification: true
      expected_authority_names:
        - 'Developer ID Installer: Tableau Software, LLC (QJ4XPRK37C)'
        - 'Developer ID Certification Authority'
        - 'Apple Root CA'
      input_path: '%RECIPE_CACHE_DIR%/downloads/%DMG%-%CPU%.dmg/Tableau Desktop.pkg'
