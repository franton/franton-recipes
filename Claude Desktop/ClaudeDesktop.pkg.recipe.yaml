Description: Versions the downloaded pkg of Claude Desktop.
Identifier: com.github.franton.pkg.ClaudeDesktop
ParentRecipe: com.github.franton.icon.ClaudeDesktop
MinimumVersion: '2.9'

Input:
  NAME: ClaudeDesktop
  SIZE: ''
  EXCLUDE: ''
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: PkgCopier
    Arguments:
      source_pkg: "%pathname%"
      pkg_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%-%version%.pkg"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/downloads'
        - '%RECIPE_CACHE_DIR%/outerunpack'
        - '%RECIPE_CACHE_DIR%/unpack'
