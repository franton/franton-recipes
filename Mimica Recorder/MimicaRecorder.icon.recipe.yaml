Description: Creates an icon for Mimica Recorder.
Identifier: com.github.franton.icon.MimicaRecorder
ParentRecipe: com.github.franton.download.MimicaRecorder
MinimumVersion: '2.9'

Input:
  NAME: MimicaRecorder
  EXCLUDE: ''
  SIZE: ''
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      flat_pkg_path: "%pathname%/com.mimica.recorder-osx-Setup.pkg"
      destination_path: "%RECIPE_CACHE_DIR%/outerunpack"

  - Processor: PkgPayloadUnpacker
    Arguments:
      pkg_payload_path: "%RECIPE_CACHE_DIR%/outerunpack/1.pkg/Payload"
      destination_path: "%RECIPE_CACHE_DIR%/unpack"

  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/unpack/Applications/Mimica Recorder.app/Contents/Info.plist"

  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/%version%"
      pkgdirs: {}

  - Processor: com.github.franton.SharedProcessors/IconGenerator
    Arguments:
      file_path: "%RECIPE_CACHE_DIR%/unpack/Applications/Mimica Recorder.app"
      exclude: '%EXCLUDE%'
      name_prefix: '%NAME%'
      output_path: "%RECIPE_CACHE_DIR%/%version%"
      size: "%SIZE%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/unpack'
        - '%RECIPE_CACHE_DIR%/outerunpack'
