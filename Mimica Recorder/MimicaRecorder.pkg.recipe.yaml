Description: Versions the Mimica Recorder pkg file.
Identifier: com.github.franton.pkg.MimicaRecorder
ParentRecipe: com.github.franton.icon.MimicaRecorder
MinimumVersion: '2.9'

Input:
  NAME: MimicaRecorder
  EXCLUDE: ''
  SIZE: ''
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: PkgCopier
    Arguments:
      source_pkg: "%pathname%"
      pkg_path: "%RECIPE_CACHE_DIR%/%version%/%NAME%-%version%.pkg"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/downloads'
