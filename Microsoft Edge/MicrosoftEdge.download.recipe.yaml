Description: Downloads the latest Microsoft Edge
Identifier: com.github.franton.download.MicrosoftEdge

Input:
  NAME: MicrosoftEdge
  MS_ID: '2093504'
  MS_URL: 'https://go.microsoft.com/fwlink/?linkid='
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: URLDownloader
    Arguments:
      url: '%MS_URL%%MS_ID%'
      filename: '%NAME%.pkg'

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments: 
      input_path: "%pathname%"
      expected_authority_names: 
        - "Developer ID Installer: Microsoft Corporation (UBF8T346G9)"
        - "Developer ID Certification Authority"
        - "Apple Root CA"
