Description: Jamf upload recipe for NexThink Collector uninstaller
Identifier: com.github.franton.upload.jamf.NexThinkCollector-Uninstaller
ParentRecipe: com.github.franton.sign.NexThinkCollector-Uninstaller
MinimumVersion: '2.9'

Input:
  NAME: NexThinkCollector-Uninstaller
  DMG: Nexthink_Collector.dmg
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'
  
  # Package and signing variables
  CORP_ID: ""
  SIGNINGCERTIFICATE: ""

  # Icon recipe settings
  SIZE: ''
  EXCLUDE: ''

  # Processor variables
  REMOVE_OLD_PACKAGES: 'True'
  PKG_TO_KEEP: '2'
  PKG_NAME_MATCH: '%NAME%-'
  SLEEP: '1'
  MAX_TRIES: '5'
  DRY_RUN: 'False'

  SELF_SERVICE_CATEGORY: ''

Process:
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: "%SELF_SERVICE_CATEGORY%"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageUploader
    Arguments:
      pkg_category: '%SELF_SERVICE_CATEGORY%'
      pkg_info: '%pkg_path%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
     
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageCleaner
    Arguments:
      pkg_name_match: '%PKG_NAME_MATCH%'
      versions_to_keep: '%PKG_TO_KEEP%'
      sleep: '%SLEEP%'
      max_tries: '%MAX_TRIES%'
      dry_run: '%DRY_RUN%'
