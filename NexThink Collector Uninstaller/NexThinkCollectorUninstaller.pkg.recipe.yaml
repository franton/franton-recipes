Description: Packages current release installer of NexThink Collector.
Identifier: com.github.franton.pkg.NexThinkCollector-Uninstaller
ParentRecipe: com.github.franton.icon.NexThinkCollector-Uninstaller
MinimumVersion: '2.9'
Comment: Create an override and set the variables in an override. DO NOT USE this recipe directly.

Input:
  NAME: NexThinkCollector-Uninstaller
  DMG: Nexthink_Collector.dmg
  CORP_ID: 'test'
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'True'

  # Icon recipe settings
  EXCLUDE: 'ua'
  SIZE: '512'

Process:
# Prereqs checks before proceeding
  - Processor: StopProcessingIf
    Arguments:
      predicate: 'CORP_ID == nil'

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

# Create pkg for the installer
  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/Scripts"
      pkgdirs: {}

  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
      pkgdirs: {}

  - Processor: Copier
    Arguments:
      source_path: "%pathname%/uninstaller"
      destination_path: "%RECIPE_CACHE_DIR%/Scripts/postinstall.sh"

  - Processor: com.github.franton.SharedProcessors/FileMode
    Arguments:
      file_path: '%RECIPE_CACHE_DIR%/Scripts/postinstall.sh'
      file_mode: '0777'

# Finally generate the installer pkg
  - Processor: PkgCreator
    Arguments:
      pkg_request: 
        pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
        pkgdir: "%RECIPE_CACHE_DIR%/%version%"
        pkgname: "%NAME%-%version%"
        pkgtype: flat
        id: "com.%CORP_ID%.%NAME%"
        version: "%version%"
        scripts: "Scripts"

# Finally clean up everything left over. We should have a versioned folder with two packages and icon files
  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/unpack'
        - '%RECIPE_CACHE_DIR%/outerunpack'
        - '%RECIPE_CACHE_DIR%/Scripts'
        - '%RECIPE_CACHE_DIR%/pkgroot'
        - '%RECIPE_CACHE_DIR%/downloads'
